name: Deploy
on: workflow_call

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: publish-gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: verified-site
          path: dist-site
      - run: node tools/site-files.mjs --check

      # 重跑历史 CI 时，保留当前 main 已发布的版本。
      - id: head
        shell: bash
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.head.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist-site
          clean: true
