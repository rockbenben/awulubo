# CI：检查 → 构建 → 浏览器级验收。
#
# ── 为什么 node-version 写死 '24' ──
#
# 不写 `node-version-file: package.json`，也不写成 `^24`：setup-node 会按范围装
# **最新满足的**那个版本，写范围等于把 CI 交给未来的自己 ——
# 哪天 Node 26 出来，CI 会悄悄跑到 26 上，而那次红可能跟代码无关。
# 写死一条线，CI 跑的就是我们本地在跑的那条线。
#
# ── 为什么还要 Python ──
#
# 字体覆盖检查（tools/check-text.py 读子集的 cmap）、截图检查和成品 PDF 解析使用 Python。
# 子集本身是**提交进仓库**的（src/fonts/*.woff2），CI 不用重新切字，
# 但要核对"子集有没有覆盖当前用字"——这一步就是漏字退回系统字体的那道闸门。
#
# ── 为什么浏览器要单独装 ──
#
# 版式检查、交互冒烟、乱读压力测试都要真浏览器（Playwright 自带的 chromium）。
# `--with-deps` 会带上系统依赖，否则 Ubuntu runner 上会缺字体和共享库，
# 页面能开但字全是方块。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支/PR 连推几次，把前面还在跑的取消掉。
# ⚠️ **main 上不取消**：那几次跑的是**已经合进去**的提交，取消掉等于那个提交
#    从来没被验过。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 验收只读源码；只有 main 的发布 job 获得分支写权限。
permissions:
  contents: read

jobs:
  verify:
    name: check · build · 浏览器验收
    runs-on: ubuntu-latest
    # 本地全套跑完几分钟，25 分钟已经宽得离谱——真超了就是卡死，不是慢。
    timeout-minutes: 25
    steps:
      # 这两个 action 都是**第一方 `actions/*`**，钉在大版本标签上。
      # 不钉 commit SHA——第一方 + 大版本标签是这类 workflow 的通行做法，
      # SHA 钉死换来的那点供应链收益，代价是每次升级都要手动改哈希。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Python 用于字体、截图与成品 PDF 验收。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 浏览器：版式检查、冒烟、压力测试都要它
      - run: npx playwright install --with-deps chromium

      # **先构建，再检查**。
      # 版式检查（tools/check-layout.mjs）量的是 dist/proof.html，
      # 而 dist/ 是 gitignored 的——干净检出的仓库里没有 dist/，
      # 检查排在构建前面就必然报"找不到 dist/proof.html"，CI 永远是红的。
      # 顺序反过一次，代价是一条推不上去的流水线。
      - run: npm run build
      - run: npm run site

      # 结构 / 内容审查 / 热区 / 版式 / 授权 / 字体覆盖 + 子集是不是最新
      # （npm run check 里含 check-hotspots.mjs：每个热区都要罩住它指的东西的墨迹，
      #   且在 320px 小屏上不小于 44 CSS px——孩子按不准就等于没有这个热区）
      - run: npm run check

      # 剧本体检：同一句在同页或相邻页出现两遍（读起来像卡带）
      - run: node tools/audit-script.mjs

      # 跨页重复：同一件事不许在相邻两页各说一遍
      # （对仗不算重复——「它看见你啦！」×「我看见你啦！」是两个孩子各说一句）
      - run: npm run check:repeat

      # 印刷 PDF 也要验：页数必须是 4 的倍数（骑马钉排得出帖）、
      # 字体只能是那两套授权子集（漏字会混进未授权的系统字体）
      - run: npm run pdf

      # 骑马钉拼版（家里双面打印对折即成书的那份）也要验：
      # A4/A3 分别核对所有页面的实际纸型、嵌入字体、Type3 和标题。
      - run: npm run pdf:booklet
      - run: npm run pdf:booklet -- --a3

      # 交互冒烟（Playwright，几十项断言）
      - run: npm run verify:reader
      - run: npm run smoke

      # 幼儿乱读压力测试：随机种子可复现
      - run: npm run chaos -- --seed 1 --steps 400

      # 逐页截图闸门：每页都得真的画出来，背景要铺满四条边。
      # 以前这两步（截图 + 对比度）靠本机的 html-shot 技能，
      # 路径写死在脚本里——换台机器跑不了，CI 里更跑不了，
      # 于是"整本白板"这种事只能靠人眼看联系表才发现。
      # 现在截图与对比度都由项目自己用 Playwright 拍，CI 上跑得动。
      - run: npm run shots
      - run: npm run check:shots

      # 文字对比度闸门：按真实像素量文字底下是什么颜色
      # （正文 ≥ 4.5:1，大字 ≥ 3:1）；屏幕版与印刷版都量。
      - run: npm run check:contrast

      # 给闸门验牙齿：故意弄坏一处 → 闸门必须报错 → 改回去。
      # 四道闸门的牙齿脚本一起跑（内容审查 / 色系 / 对比度 / 跨页重复）。
      # 放在最后：它会改源文件再恢复（trap 里 restore），
      # 排在其他检查前面的话，万一中途被杀掉，后面的检查量到的就是
      # 被弄坏的那一版页面。
      # 牙齿脚本自己带 broke() 守卫：破坏没生效（sed 没匹配上）会直接判失败，
      # 不会把「根本没验」当成「闸门没牙齿」。
      - run: npm run verify:teeth

      # dist-site 在验收开始前从同一次构建取出，牙齿脚本只会重建本地 dist。
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run check:publish
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-site
          path: dist-site/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
