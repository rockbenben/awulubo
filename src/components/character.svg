          d="M 468 456 C 486 444, 514 444, 532 456 C 540 476, 496 490, 468 456 Z" />
  </g>

  <!-- 附加件：让情绪不止在脸上 -->
  <g id="ch-blush-deep">
    <circle style="fill:var(--cheek);opacity:0.8" cx="336" cy="424" r="38" />
    <circle style="fill:var(--cheek);opacity:0.8" cx="664" cy="424" r="38" />
  </g>

  <!-- 汗滴：吓一跳 -->
  <g id="ch-sweat">
