          d="M 404 462 C 442 566, 558 566, 596 462 C 538 496, 462 496, 404 462 Z" />
    <path style="fill:var(--tongue)" d="M 452 520 C 462 486, 538 486, 548 520 C 518 538, 482 538, 452 520 Z" />
  </g>

  <g id="ch-mouth-flat">
    <path style="fill:none;stroke:var(--ink);stroke-width:24;stroke-linecap:round" d="M 448 478 C 478 468, 522 468, 552 478" />
  </g>

  <!-- smirk：得意的歪嘴（一边高一边低） -->
  <g id="ch-mouth-smirk">
    <path style="fill:none;stroke:var(--ink);stroke-width:24;stroke-linecap:round" d="M 436 470 C 470 492, 522 484, 550 450" />
  </g>

  <!-- tongue：调皮吐舌头 -->
  <g id="ch-mouth-tongue">
    <path style="fill:none;stroke:var(--ink);stroke-width:24;stroke-linecap:round" d="M 432 456 C 462 482, 538 482, 568 456" />
    <path style="fill:var(--tongue);stroke:var(--ink);stroke-width:16;stroke-linecap:round;stroke-linejoin:round"
          d="M 470 474 C 480 524, 520 524, 530 474 C 512 484, 488 484, 470 474 Z" />
  </g>

  <!-- frown：往下撇的嘴（难过） -->
  <g id="ch-mouth-frown">
    <path style="fill:none;stroke:var(--ink);stroke-width:24;stroke-linecap:round" d="M 432 492 C 462 462, 538 462, 568 492" />
  </g>

  <!-- pout：噘嘴（小嘴） -->
  <g id="ch-mouth-pout">
