        <use href="#ch-feet" />
    <use href="#ch-arm-l-down" />
    <use href="#ch-arm-r-down" />
    <use href="#ch-body" />

    <use href="#ch-brows-excited" />
    <use href="#ch-eyes-happy" />
    <use href="#ch-cheeks" />
    <use href="#ch-mouth-grin" />
  </g>

  <!-- peek：从下缘探出头（页面负责裁切） -->
