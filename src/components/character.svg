  </g>

  <!-- ============ 新增的姿态（第十二轮之后补的） ============
       原来九种姿态撑不住二十八个跨页：
       同一个「眯眼大笑」出现了十几次，角色读起来像一张贴图反复用。
       下面九种把情绪拆开——好奇、害羞、惊喜、调皮、欢呼、招手、
       困了、累了、得意。 -->

