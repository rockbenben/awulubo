          d="M 700 336 C 666 306, 632 326, 636 356 C 640 386, 700 416, 700 416 C 700 416, 760 386, 764 356 C 768 326, 734 306, 700 336 Z" />
  </g>

  <!-- zzz：睡着了（夜色页上用，纸白） -->
