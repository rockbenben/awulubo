    <path style="fill:none;stroke:var(--paper);stroke-width:16;stroke-linecap:round;stroke-linejoin:round" d="M 706 216 L 748 216 L 706 254 L 750 254" />
  </g>

  <!-- ============ 姿态（不含螺旋：螺旋由页面单独引用，方便在屏幕上转） ============ -->

  <!-- idle：平常，闭着嘴 -->
  <g id="pose-idle">
        <use href="#ch-feet" />
    <use href="#ch-arm-l-down" />
    <use href="#ch-arm-r-down" />
    <use href="#ch-body" />

    <use href="#ch-brows-neutral" />
    <use href="#ch-eyes-dots" />
    <use href="#ch-cheeks" />
    <use href="#ch-mouth-smile" />
  </g>

  <!-- hungry：饿了，眉毛发愁，嘴微微张着 -->
  <g id="pose-hungry">
        <use href="#ch-feet" />
    <use href="#ch-arm-l-down" />
    <use href="#ch-arm-r-down" />
    <use href="#ch-body" />

    <use href="#ch-brows-worried" />
    <use href="#ch-eyes-dots" />
    <use href="#ch-cheeks" />
    <use href="#ch-mouth-oops" />
  </g>

  <!-- chomp：啊呜，大张嘴 -->
  <g id="pose-chomp">
        <use href="#ch-feet" />
    <use href="#ch-arm-l-down" />
    <use href="#ch-arm-r-down" />
    <use href="#ch-body" />

    <use href="#ch-brows-excited" />
    <use href="#ch-eyes-dots" />
    <use href="#ch-mouth-open" />
  </g>

  <!-- happy：吃饱了，眯眼大笑 -->
