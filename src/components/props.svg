<!-- 道具库：苹果 / 小鱼 / 黄星星 / 手绘白底块。
     坐标系 1000 × 1000，道具居中，页面用 <use> 的 width/height 控制大小。
     同 character.svg：影子树内只能用内联样式 + CSS 变量。 -->

<svg xmlns="http://www.w3.org/2000/svg">

  <!-- 红苹果 -->
  <g id="prop-apple">
    <path style="fill:var(--red);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 936.4 560.0 C 937.0 592.5 929.8 627.3 918.7 658.0 C 907.5 688.8 891.3 720.1 869.7 744.3 C 848.1 768.6 816.8 787.3 789.3 803.5 C 761.7 819.6 732.6 831.8 704.4 841.4 C 676.2 850.9 647.6 857.1 620.0 860.6 C 592.4 864.1 565.2 861.6 538.7 862.6 C 512.1 863.5 487.3 866.6 460.8 866.3 C 434.4 866.1 407.7 864.8 379.8 861.0 C 351.9 857.3 321.2 854.2 293.6 844.1 C 266.0 834.0 240.2 817.8 214.1 800.6 C 188.0 783.4 158.2 765.0 137.0 741.0 C 115.8 717.0 99.8 686.9 86.9 656.7 C 73.9 626.6 60.4 592.5 59.2 560.0 C 58.0 527.5 66.3 491.5 79.8 461.6 C 93.2 431.7 118.7 405.2 139.8 380.4 C 160.8 355.6 179.8 329.2 206.0 312.6 C 232.3 296.0 266.5 285.4 297.1 280.8 C 327.8 276.2 361.8 281.5 390.1 284.7 C 418.4 287.9 443.0 296.5 466.8 299.9 C 490.5 303.4 509.2 306.6 532.6 305.2 C 556.0 303.8 579.3 295.0 607.1 291.6 C 635.0 288.3 670.1 280.3 699.8 284.9 C 729.6 289.6 758.6 303.9 785.6 319.7 C 812.6 335.4 840.3 355.7 861.8 379.6 C 883.4 403.5 902.5 432.8 914.9 462.8 C 927.4 492.9 935.8 527.5 936.4 560.0 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:30;stroke-linecap:round" d="M 522 308 C 524 250, 530 180, 546 108" />
    <path style="fill:var(--green);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 546 116 C 588 76, 656 68, 684 94 C 658 142, 586 150, 546 116 Z" />
  </g>

  <!-- 蓝小鱼 -->
  <g id="prop-fish">
    <path style="fill:var(--blue);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 690 438 C 774 396, 846 416, 880 468 C 838 478, 798 488, 758 500 C 798 512, 838 522, 880 532 C 846 584, 774 604, 690 562 Z" />
    <path style="fill:var(--blue);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 428 384 C 458 312, 540 302, 570 376 C 518 366, 468 372, 428 384 Z" />
    <path style="fill:var(--blue);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 418 610 C 450 666, 520 670, 546 618 C 500 624, 458 622, 418 610 Z" />
    <path style="fill:var(--blue);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 250 500 C 302 398, 432 370, 562 398 C 644 416, 704 450, 734 500 C 704 550, 644 584, 562 602 C 432 630, 302 602, 250 500 Z" />
    <circle style="fill:var(--paper);stroke:var(--ink);stroke-width:18" cx="300" cy="462" r="44" />
    <circle style="fill:var(--ink)" cx="312" cy="468" r="18" />
  </g>

  <!-- 黄星星 -->
  <g id="prop-star">
    <path style="fill:var(--yellow);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 500.0 54.1 C 516.1 53.3 597.3 311.6 625.3 332.5 C 653.3 353.5 915.0 352.9 919.7 368.6 C 924.3 384.4 706.3 536.0 695.3 568.5 C 684.3 600.9 767.8 845.3 754.8 855.7 C 741.8 866.0 533.7 724.6 500.0 724.3 C 466.3 723.9 261.4 861.1 249.0 850.5 C 236.6 839.9 324.9 597.0 314.6 565.2 C 304.4 533.4 90.9 388.3 95.5 373.6 C 100.1 358.9 356.6 366.0 383.5 344.7 C 410.5 323.4 483.9 54.9 500.0 54.1 Z" />
  </g>

  <!-- 手绘白底块（满版色页上垫字用） -->
  <g id="prop-blob-white">
    <path style="fill:var(--paper)"
          d="M 916.3 500.0 C 916.9 506.5 908.9 520.9 902.7 527.1 C 896.5 533.3 875.4 546.2 864.5 551.8 C 853.7 557.4 826.3 568.7 812.4 573.5 C 798.5 578.3 765.6 588.2 748.8 592.0 C 732.0 595.9 691.7 603.1 672.3 605.6 C 652.9 608.0 607.6 611.4 586.9 612.4 C 566.3 613.3 520.8 613.7 500.0 613.6 C 479.2 613.5 434.5 612.6 413.5 611.8 C 392.5 611.1 345.9 609.1 325.0 607.2 C 304.0 605.4 257.6 600.1 239.1 596.5 C 220.5 593.0 183.4 582.8 170.4 577.5 C 157.4 572.2 137.3 558.6 130.9 552.4 C 124.5 546.2 118.9 532.1 117.2 525.8 C 115.4 519.5 115.6 506.1 116.3 500.0 C 116.9 493.9 119.5 480.7 122.8 474.6 C 126.1 468.5 136.1 455.2 143.8 449.4 C 151.5 443.6 174.2 431.4 187.0 426.4 C 199.7 421.3 233.4 411.5 250.0 407.5 C 266.6 403.5 306.1 396.0 325.2 392.9 C 344.3 389.9 387.9 384.1 408.9 382.3 C 429.9 380.4 478.1 377.7 500.0 377.6 C 521.9 377.5 570.8 379.7 591.5 381.8 C 612.1 383.8 654.5 391.0 672.1 394.6 C 689.6 398.2 723.0 407.7 737.8 412.0 C 752.7 416.3 782.2 425.8 795.9 430.4 C 809.5 435.0 839.6 444.9 851.7 450.0 C 863.9 455.2 889.4 467.3 897.1 473.3 C 904.9 479.3 915.6 493.5 916.3 500.0 Z" />
  </g>

  <!-- 气泡 -->
  <g id="prop-bubble">
    <circle style="fill:var(--paper);stroke:var(--ink);stroke-width:10" cx="500" cy="500" r="300" />
    <circle style="fill:var(--paper);stroke:var(--ink);stroke-width:8" cx="250" cy="250" r="160" />
  </g>

  <!-- 小花：点彩纸之后，从彩纸里冒出来 -->
  <g id="prop-flower">
    <g style="fill:var(--flower,var(--pink))">
      <circle cx="500" cy="370" r="155" />
      <circle cx="620" cy="450" r="155" />
      <circle cx="557" cy="592" r="155" />
      <circle cx="443" cy="592" r="155" />
      <circle cx="380" cy="450" r="155" />
    </g>
    <circle style="fill:var(--flower-center,var(--yellow))" cx="500" cy="478" r="112" />
  </g>

  <!-- 月亮：满月 + 几个环形山 -->
  <g id="prop-moon">
    <circle style="fill:var(--moon)" cx="500" cy="500" r="300" />
    <circle style="fill:var(--moon-deep)" cx="420" cy="400" r="46" />
    <circle style="fill:var(--moon-deep)" cx="590" cy="590" r="34" />
    <circle style="fill:var(--moon-deep)" cx="560" cy="360" r="22" />
  </g>

  <!-- 手绘圆箭头（"再读一次"） -->
  <g id="prop-arrow">
    <path style="fill:none;stroke:var(--ink);stroke-width:36;stroke-linecap:round"
          d="M 252 316 A 300 300 0 1 1 648 206" />
    <path style="fill:var(--ink)" d="M 752 214 L 792 288 L 700 296 Z" />
  </g>

  <!-- 毯子（第二册：盖在噜啵身上）
       —— 原来是**一个碗形的拱盖**（半圆 + 一道弧线），画出来像个空碗：
          p07「它躲在毯子底下」时毯子在角色左边地上，根本没盖住它；
          p13「给它盖上毯子」时毯子端端正正扣在头顶上，像戴帽子。
       改成**搭在身上的一块毯子**：上面一条圆弧（远边，搭在肩上），
       下面是**波浪形的垂边**（近边搭下来），中间三道褶。
       本地坐标的范围：x 95–905，y 95–575。 -->
  <g id="prop-blanket">
    <path style="fill:var(--pink);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 95 240 C 95 145, 275 95, 500 95 C 725 95, 905 145, 905 240
             C 928 330, 920 420, 905 470
             C 830 522, 748 458, 655 512
             C 560 568, 452 462, 358 512
             C 272 556, 168 462, 95 452
             C 74 392, 72 312, 95 240 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round"
          d="M 288 205 C 302 300, 292 386, 280 458" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round"
          d="M 500 172 C 512 285, 506 380, 497 474" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round"
          d="M 712 205 C 726 292, 718 378, 708 450" />
  </g>

  <!-- 同一粉色毯子的局部折角：寻找时只露布角，不提前画出整条毯子和脚。 -->
  <g id="prop-blanket-corner">
    <path style="fill:var(--pink);stroke:var(--ink);stroke-width:26;stroke-linecap:round;stroke-linejoin:round"
          d="M 120 160 C 290 145, 510 205, 760 450 C 635 480, 480 530, 340 650 C 285 470, 210 300, 120 160 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round"
          d="M 150 180 C 300 260, 385 390, 420 515" />
  </g>

  <!-- 水杯（第二册：喂它喝水） -->
  <g id="prop-cup">
    <path style="fill:var(--paper);stroke:var(--ink);stroke-width:26;stroke-linejoin:round"
          d="M 330 340 L 400 720 L 600 720 L 670 340 Z" />
    <path style="fill:var(--blue);stroke:var(--ink);stroke-width:20;stroke-linejoin:round"
          d="M 352 400 L 400 660 L 600 660 L 648 400 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:24;stroke-linecap:round"
          d="M 664 420 C 764 420, 764 566, 652 566" />
  </g>

  <!-- 药丸（第二册：最难的一关） -->
  <g id="prop-pill">
    <path style="fill:var(--paper);stroke:var(--ink);stroke-width:24;stroke-linejoin:round"
          d="M 340 430 C 340 378, 382 348, 434 348 L 566 348 C 618 348, 660 378, 660 430 C 660 482, 618 512, 566 512 L 434 512 C 382 512, 340 482, 340 430 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round" d="M 500 352 L 500 508" />
  </g>

  <!-- 球（第三册《一起玩！》：轮流玩的那颗球）
       —— 颜色走 CSS 变量：页面数据写 style="--ball:var(--blue)" 就能换成蓝球，
          不用为每种颜色各画一个。条纹是纸白的一条粗线 + 一道细墨线，
          跟其他道具一样有手描的轮廓。 -->
  <g id="prop-ball">
    <circle style="fill:var(--ball,var(--red));stroke:var(--ink);stroke-width:26" cx="500" cy="500" r="300" />
    <path style="fill:none;stroke:var(--ball-band,var(--paper));stroke-width:72;stroke-linecap:round"
          d="M 310 650 C 390 570, 490 530, 600 530 C 660 530, 710 550, 750 585" />
    <path style="fill:none;stroke:var(--ink);stroke-width:20;stroke-linecap:round"
          d="M 310 650 C 390 570, 490 530, 600 530 C 660 530, 710 550, 750 585" />
  </g>

  <!-- 积木（第四册《生气啦！》：搭了又倒的那座塔）
       —— 三个面：正面 + 顶面 + 侧面。三个面各自的颜色也走变量，
          页面数据可以写 style="--block-face:var(--red)"。 -->
  <g id="prop-block">
    <path style="fill:var(--block-top,var(--yellow));stroke:var(--ink);stroke-width:24;stroke-linejoin:round"
          d="M 320 400 L 400 300 L 760 300 L 680 400 Z" />
    <path style="fill:var(--block-side,var(--orange));stroke:var(--ink);stroke-width:24;stroke-linejoin:round"
          d="M 680 400 L 760 300 L 760 630 L 680 730 Z" />
    <path style="fill:var(--block-face,var(--yellow));stroke:var(--ink);stroke-width:24;stroke-linejoin:round"
          d="M 320 400 L 680 400 L 680 730 L 320 730 Z" />
    <circle style="fill:none;stroke:var(--ink);stroke-width:22" cx="500" cy="565" r="70" />
  </g>

  <!-- 篮子（第五册《我自己来！》：把宝贝收进去的那只篮子）
       —— 提手是一个弧，筐身是梯形，三道横线是编出来的纹。 -->
  <g id="prop-basket">
    <path style="fill:none;stroke:var(--ink);stroke-width:26;stroke-linecap:round"
          d="M 300 330 C 300 190, 700 190, 700 330" />
    <path style="fill:var(--basket,var(--orange));stroke:var(--ink);stroke-width:26;stroke-linejoin:round"
          d="M 250 330 L 750 330 L 690 760 Q 500 812, 310 760 Z" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round" d="M 264 480 L 736 480" />
    <path style="fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round" d="M 278 620 L 722 620" />
  </g>

  <!-- 睡着了的 z（第二册） -->
  <g id="prop-zzz">
    <path style="fill:none;stroke:var(--paper);stroke-width:22;stroke-linecap:round;stroke-linejoin:round" d="M 180 240 L 330 240 L 180 390 L 340 390" />
    <path style="fill:none;stroke:var(--paper);stroke-width:16;stroke-linecap:round;stroke-linejoin:round" d="M 370 80 L 470 80 L 370 190 L 480 190" />
  </g>


  <!-- 彩纸是独立物件，身份由书稿给定；不是满版喷纸特效。 -->
  <g id="prop-paper" style="fill:var(--pink);stroke:var(--ink);stroke-width:18;stroke-linejoin:round"><path d="M 160 300 L 760 255 L 810 590 L 210 635 Z"/></g>
  <g id="prop-paper-red" style="fill:var(--red);stroke:var(--ink);stroke-width:15"><path d="M 160 300 L 760 255 L 810 590 L 210 635 Z"/></g>
  <g id="prop-paper-blue" style="fill:var(--blue);stroke:var(--ink);stroke-width:15"><path d="M 160 300 L 760 255 L 810 590 L 210 635 Z"/></g>
  <g id="prop-paper-yellow" style="fill:var(--yellow);stroke:var(--ink);stroke-width:15"><path d="M 160 300 L 760 255 L 810 590 L 210 635 Z"/></g>
  <g id="prop-palm" style="fill:var(--wash-orange);stroke:var(--ink);stroke-width:18;stroke-linecap:round;stroke-linejoin:round"><path d="M 210 800 L 185 1550 L 620 1550 L 580 800 Z"/><path d="M 210 820 L 240 610 Q 145 525 175 485 Q 200 456 295 540 L 300 310 Q 305 260 340 280 L 375 480 L 410 230 Q 420 190 452 220 L 470 475 L 530 260 Q 550 225 573 260 L 565 500 L 635 350 Q 660 320 680 355 L 650 605 Q 630 700 585 740 L 580 820 Z"/></g>

  <!-- 同毯的软折边：嘴下、头顶、肩背及推向孩子的角，均复用粉毯材质。 -->
  <g id="prop-blanket-fold" style="fill:var(--pink);stroke:var(--ink);stroke-width:22;stroke-linejoin:round"><path d="M 80 230 Q 330 105 650 200 L 865 550 Q 615 610 350 545 L 90 565 Q 155 400 80 230 Z"/><path d="M 80 230 Q 365 210 650 200 L 570 300 Q 300 275 80 230" style="fill:none;stroke-width:14"/></g>
  <g id="prop-blanket-hood" style="fill:var(--pink);stroke:var(--ink);stroke-width:20;stroke-linejoin:round"><path d="M 100 220 Q 510 45 880 235 L 780 440 L 710 245 Q 465 180 255 270 L 155 420 Z"/><path d="M 155 420 L 255 270 Q 465 180 710 245" style="fill:none;stroke-width:12"/></g>
  <g id="prop-blanket-drape" style="fill:var(--pink);stroke:var(--ink);stroke-width:20;stroke-linejoin:round"><path d="M 80 190 Q 480 10 900 190 L 870 660 L 735 680 L 710 250 Q 460 180 285 280 L 260 675 L 100 640 Z"/><path d="M 140 265 L 160 580 M 810 255 L 820 590" style="fill:none;stroke-width:12"/></g>
  <g id="prop-blanket-shared"><use href="#prop-blanket"/><path d="M 105 445 Q -30 440 -10 575 Q 145 650 355 513" style="fill:var(--pink);stroke:var(--ink);stroke-width:24;stroke-linejoin:round"/></g>
  <!-- 一口后的苹果保持同一身份和缺口，不再次整只出现。 -->
  <g id="prop-apple-bitten" style="stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round"><path d="M 490 245 C 250 130 100 335 170 600 Q 245 845 480 770 Q 645 845 790 650 Q 675 635 710 535 Q 610 510 665 410 Q 595 350 675 270 Q 590 205 490 245 Z" style="fill:var(--red);stroke-width:26"/><path d="M 490 245 Q 475 135 525 98" style="fill:none;stroke-width:24"/></g>
  <!-- 成人持勺的手与袖口是一个对象；不画散放药丸，不提供孩子热区。 -->
  <g id="prop-medicine-adult" style="stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round"><path d="M 210 150 L 560 150" style="fill:none;stroke-width:23"/><ellipse cx="85" cy="150" rx="83" ry="36" style="fill:var(--paper);stroke-width:16"/><path d="M 37 139 Q 87 119 134 141" style="fill:none;stroke:var(--purple);stroke-width:20"/><path d="M 450 165 Q 423 80 480 75 L 620 110 Q 695 150 650 260 L 635 450 L 475 450 L 485 260 L 400 215 Q 358 183 390 150 Q 410 139 450 165 Z" style="fill:#F6C5AC;stroke-width:20"/><path d="M 470 365 L 640 365 L 652 490 L 455 490 Z" style="fill:var(--blue);stroke-width:20"/></g>
  <g id="prop-blanket-lap" style="fill:var(--pink);stroke:var(--ink);stroke-width:22;stroke-linejoin:round"><path d="M 70 215 Q 470 170 900 220 L 870 415 Q 660 460 470 412 Q 240 465 90 415 Z"/><path d="M 220 225 L 235 390 M 490 218 L 485 400 M 735 230 L 725 395" style="fill:none;stroke-width:12"/></g>

  <g id="prop-blanket-lap-open"><use href="#prop-blanket-lap"/><path d="M 735 230 L 880 185 L 900 305 Z" style="fill:var(--pink);stroke:var(--ink);stroke-width:20;stroke-linejoin:round"/></g>
  <g id="prop-blanket-lap-shared"><use href="#prop-blanket-lap"/><path d="M 94 310 Q -42 320 -75 420 Q 45 478 235 420" style="fill:var(--pink);stroke:var(--ink);stroke-width:22;stroke-linejoin:round"/></g>
  <g id="prop-foot-pushing"><g transform="translate(-620 -690)"><use href="#ch-foot-raised"/></g></g>

  <g id="prop-ball-squeezed"><g transform="translate(-100 250) scale(1.2 .5)"><use href="#prop-ball"/></g></g>
  <!-- 孩子的手独立于角色；伸手、争抢和摘发带只作故事画面，不要求真实拉扯。 -->
  <g id="prop-child-reach" style="fill:var(--wash-orange);stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round"><path d="M 0 45 L 204 45 Q 244 -4 278 22 L 330 50 Q 370 53 358 76 L 312 77 L 355 95 Q 378 112 355 126 L 310 112 Q 348 141 323 151 L 265 124 Q 280 164 250 162 L 205 119 L 0 125 Z"/></g>

  <g id="prop-wall-foot" style="fill:none;stroke:var(--scene-ink,var(--ink));stroke-opacity:var(--scene-line-opacity,.25);stroke-width:16;stroke-linecap:round;stroke-linejoin:round"><path d="M 0 20 Q 120 -30 130 180 L 130 420 Q 230 480 440 440"/></g>
  <g id="prop-scarf" style="fill:var(--orange);stroke:var(--ink);stroke-width:16;stroke-linejoin:round"><path d="M 40 150 Q 260 90 510 170 L 610 210 L 555 260 L 465 205 Q 245 160 40 205 Z"/><path d="M 490 175 L 605 110 L 665 155 L 560 220 Z"/></g>
  <g id="prop-child-foot" style="fill:var(--wash-orange);stroke:var(--ink);stroke-width:16;stroke-linecap:round;stroke-linejoin:round"><path d="M 60 -140 L 190 -140 L 200 35 Q 260 35 290 80 Q 330 45 355 80 Q 400 70 400 110 Q 400 165 325 170 L 105 170 Q 40 160 60 90 Z"/><path d="M 295 94 L 290 130 M 350 100 L 340 135" style="fill:none;stroke-width:10"/></g>
  <g id="prop-color-edge"><path d="M -70 10 Q 170 130 95 300 Q 150 490 -60 670 Z" style="fill:var(--edge,var(--wash-red));stroke:none"/></g>
  <!-- 同一橘篮的翻倒和侧躺剖视；开口朝右，原三物由独立对象放在内腔。 -->
  <g id="prop-basket-fallen"><g transform="rotate(125 500 500)"><use href="#prop-basket"/></g></g>
  <g id="prop-basket-side" style="stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round">
    <path d="M 110 300 Q 355 235 720 270 L 720 730 Q 350 770 110 700 Q 28 500 110 300 Z" style="fill:var(--basket,var(--orange));stroke-width:24"/>
    <path d="M 165 350 Q 405 300 675 325 L 675 680 Q 390 710 165 650 Q 110 500 165 350 Z" style="fill:var(--wash-orange);stroke-width:15"/>
    <path d="M 100 425 L 140 420 M 76 560 L 129 560 M 270 730 L 265 690 M 430 745 L 430 705 M 585 743 L 585 700" style="fill:none;stroke-width:16"/>
    <ellipse cx="720" cy="500" rx="100" ry="230" style="fill:none;stroke-width:24"/>
    <path d="M 737 270 Q 925 480 742 730" style="fill:none;stroke-width:18"/>
  </g>
  <g id="prop-child-cradle" style="fill:var(--wash-orange);stroke:var(--ink);stroke-width:18;stroke-linejoin:round"><path d="M 0 100 Q 245 205 470 115 L 620 45 Q 664 32 670 66 L 552 155 Q 310 310 0 205 Z"/><path d="M 544 111 L 610 82" style="fill:none;stroke-width:12;stroke-linecap:round"/></g>
  <g id="prop-child-reach-left"><g transform="translate(400 0) scale(-1 1)"><use href="#prop-child-reach"/></g></g>
</svg>
