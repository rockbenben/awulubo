# 《啊呜噜啵！》屏幕互动版 —— 整站根目录
# 用法：改 server_name 与 root，放到 /etc/nginx/conf.d/book.conf
#       nginx -t && systemctl reload nginx
# 证书：certbot --nginx -d book.example.com（它会自己补上 listen 443 ssl 那一段）

server {
    listen 80;
    listen [::]:80;
    server_name book.example.com;

    # dist/ 的内容直接放这层（index.html / book.pdf / shots/ …）
    root /var/www/awulubo;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 屏幕版 429 KB，gzip 后约 197 KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # 改版后别让浏览器卡在旧版
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 印刷 PDF：类型要对，浏览器才能翻页预览而不是强制下载
    location ~* \.pdf$ {
        default_type application/pdf;
        expires 7d;
        # 想让"点了直接下载"就取消下面这行
        # add_header Content-Disposition "attachment";
    }

    # 逐页截图（不想公开就别传 shots/）
    location /shots/ {
        expires 7d;
    }
}
