# 《啊呜噜啵！》挂在已有站点的子路径下，例如 https://example.com/book/
# 用法：dist/ 的内容放到 <root>/book/ 下
#       （本项目是单文件、相对路径，挂在子路径下不用改任何东西）

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 例如 dist/ 放在 /var/www/book/
    root /var/www;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # 找不到就回首页（hash 路由其实用不到，但兜底更稳）
    location /book/ {
        try_files $uri $uri/ /book/index.html;
    }

    location = /book/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/book/.*\.pdf$ {
        default_type application/pdf;
        expires 7d;
    }
}
