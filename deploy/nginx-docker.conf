# 《啊呜噜啵！》—— 容器内的 nginx（静态文件在 /usr/share/nginx/html）
# 供 deploy/Dockerfile 使用。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.pdf$ {
        default_type application/pdf;
        expires 7d;
    }
}
