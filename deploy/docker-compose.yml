# 《啊呜噜啵！》—— docker compose 起一个
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
#      → http://服务器IP:8080
#
# 构建上下文必须是仓库根（Dockerfile 在 deploy/ 下）：
#   docker compose -f deploy/docker-compose.yml ... （本文件已写好 context）

services:
  book:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: awulubo:latest
    container_name: awulubo-book
    ports:
      - "8080:80"
    restart: unless-stopped
